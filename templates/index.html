<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToonGuide - Cartoon Characters Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #ffe066, #ff8fab);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .chat-container {
      width: 100%;
      max-width: 640px;
      height: 90vh;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #7b2cbf;
      color: #ffffff;
      padding: 16px 20px;
    }

    .chat-header h1 { font-size: 1.25rem; }
    .chat-header p { font-size: 0.85rem; opacity: 0.85; margin-top: 2px; }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #faf5ff;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.45;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #7b2cbf;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: #ffffff;
      color: #333333;
      border: 1px solid #e6d8f5;
      border-bottom-left-radius: 4px;
    }

    .chat-input {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #eee;
      background: #ffffff;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input input:focus { border-color: #7b2cbf; }

    .chat-input button {
      padding: 0 22px;
      border: none;
      border-radius: 24px;
      background: #ff5d8f;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .chat-input button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>ToonGuide</h1>
      <p>Ask me anything about cartoon characters!</p>
    </div>

    <div class="chat-messages" id="messages"></div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Ask about a cartoon character..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const messagesBox = document.getElementById("messages");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const history = [];

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = "message " + sender;
      div.textContent = text;
      messagesBox.appendChild(div);
      messagesBox.scrollTop = messagesBox.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, "user");
      userInput.value = "";
      sendBtn.disabled = true;
      const typing = addMessage("Thinking...", "bot");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history: history })
        });
        const data = await response.json();
        typing.textContent = data.reply;
        history.push({ role: "user", text: text });
        history.push({ role: "bot", text: data.reply });
      } catch (error) {
        typing.textContent = "Network error. Please try again.";
      }

      sendBtn.disabled = false;
      userInput.focus();
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") sendMessage();
    });

    addMessage("Hi! I'm ToonGuide. Ask me about any cartoon character!", "bot");
  </script>
</body>
</html>
